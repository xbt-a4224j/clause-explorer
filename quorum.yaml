# What this corpus is, and which members the platform should reach for.
name: Clause Explorer
corpus: maud-public-target-merger-agreements

subject_axis: deal_points.deal_point_name
answer_dimension: deal_points.position
count_measure: deal_points.n
record_count: comparable_deals.n

numeric_measures:
  - deal_points.median_numeric_value
  - deal_points.p25_numeric_value
  - deal_points.p75_numeric_value

selectable:
  - comparable_deals
  - deal_points

# A mean kept beside the median so a reader can see the two diverge. The dashboard wants it; the
# agent selecting it would report the tail rather than the market.
excluded_measures:
  - deal_points.mean_numeric_value_do_not_use_for_market

strings:
  record: agreement
  records: agreements
  subject: deal point
  rollup_tab: Deal Terms
